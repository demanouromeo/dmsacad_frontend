<!doctype html>
<html lang="en" data-theme="dmsacad-light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/app_icon.ico" />
    <link href="/src/index.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f9fb" />
    <title>DMS-ACAD</title>
    <script>
      // Runs before ThemeProvider mounts so a stored "dark" preference doesn't flash the
      // default light theme first - light is the default (data-theme="dmsacad-light" is already
      // set on <html> above), so this only ever needs to override it.
      (function () {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dmsacad");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
