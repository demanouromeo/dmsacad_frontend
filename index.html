    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "DMS-ACAD",
        "alternateName": ["dmsacad", "dmsacad edu", "dmsacad education"],

        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web, Android",
        "inLanguage": ["fr", "en"]
      }
    </script>
    <script>
      // Runs before ThemeProvider mounts so a stored "dark" preference doesn't flash the
      // default light theme first - light is the default (data-theme="dmsacad-light" is already
      // set on <html> above), so this only ever needs to override it.
      (function () {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dmsacad");
        }
      })();
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
